# Files synced from the testbed (make sync) and vendored subcharts (make deps)
# stay byte-for-byte; check them in the testbed.
exclude: ^charts/dep-dlm/(files/|charts/|Chart\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        description: env.yaml, values.yaml, workflows, pre-commit config.
        args: [--allow-multiple-documents]
        exclude: ^charts/dep-dlm/templates/   # Helm templates are not plain YAML
      - id: check-json
      - id: check-added-large-files            # generated diagrams stay under 500 KB
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key                 # CA and host keys never belong here

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check                         # docs/diagrams, terraform/tests
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck                         # scripts/, terraform/scripts/, .devcontainer/
        exclude: \.tftpl$                      # ${...} are Terraform template variables

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11                               # >= v1.7.10 for YAML anchors
    hooks:
      - id: actionlint

  # Need helm, terraform and tflint: the devcontainer and the static-checks
  # workflow install them.
  - repo: local
    hooks:
      - id: helm-lint
        name: make lint (render every environment)
        entry: make lint
        language: system
        files: ^(charts/dep-dlm/|environments/|argocd/)
        pass_filenames: false
      - id: tf-fmt-check
        name: terraform fmt (check only)
        entry: terraform fmt -check -recursive terraform
        language: system
        files: \.tf$
        pass_filenames: false
      - id: tflint
        name: tflint
        entry: tflint --chdir=terraform --recursive
        language: system
        files: \.tf$
        pass_filenames: false
