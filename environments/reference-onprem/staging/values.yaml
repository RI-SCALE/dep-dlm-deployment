# On-premise reference: a single kubeadm node on a GCE VM, with PostgreSQL,
# MySQL and Vault on the node outside Kubernetes (terraform/environments/onprem).
# Values from `terraform -chdir=terraform/environments/onprem/vault output`
# and the infra outputs; node_internal_ip defaults to 10.40.0.10.
# Only what differs from charts/dep-dlm/values.yaml.

secretStore:
  provider: vault
  vault:
    server: https://10.40.0.10:8200              # output vault_server
    path: secret
    version: v2
    # base64 of the testbed CA (output ca_bundle); Vault's certificate comes from it
    caBundle: 
    kubernetesAuth:
      mountPath: kubernetes
      role: dep-dlm
      serviceAccount: { name: external-secrets, namespace: external-secrets }

secrets:
  certsKey: dep-dlm-onprem/certs                 # output certs_key
  configKey: dep-dlm-onprem/config               # output config_key

bootstrapDb:
  dbHost: 10.40.0.10                             # infra output rucio_database_host

# Gateway API with Traefik (hostPort 80 on the node); Rucio only for now,
# FTS is reached in-cluster by the conveyor.
gateway:
  enabled: true
  className: traefik
  listenerPort: 8000            # Traefik's web entryPoint (hostPort 80)
  routes:
    - name: rucio-server
      hostname: rucio.dep-dlm-onprem.example.com
      service: rucio-server
      port: 80

# GMP PodMonitorings are GKE-only.
observability:
  enabled: false
