# Read by the ApplicationSet (git files generator) and by scripts/bootstrap.sh.
# On-premise reference: single kubeadm node (terraform/environments/onprem).
ri: reference-onprem
stage: staging
namespace: dep-dlm-staging     # same as GKE staging, so the testbed's tests apply unchanged

baseRevision: v0.1.0
envRevision: main

# External Secrets authenticates to Vault with its Kubernetes service
# account (no cloud identity). Name and namespace must match the Vault role
# (terraform/environments/onprem/vault: eso_service_account_*).
eso:
  name: external-secrets
  namespace: external-secrets
  gcpServiceAccount: ""

gateway:
  controller: traefik           # scripts/bootstrap.sh adds argocd/traefik.yaml.tmpl
