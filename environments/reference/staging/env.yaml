# Read by the ApplicationSet (git files generator) and by scripts/bootstrap.sh.
ri: reference
stage: staging
namespace: dep-dlm-staging

# Revision of charts/dep-dlm this environment runs. Pin to a release tag
# (e.g. v0.1.0) once one exists; a core fix then ships as a pin bump.
baseRevision: main
# Revision this environment's own values are read from.
envRevision: main

# External Secrets Operator, installed by bootstrap.sh. Name and namespace
# match the Workload Identity binding of the testbed's staging Terraform
# (serviceAccount <namespace>/<name>), so its GCP service account is reused.
eso:
  name: external-secrets-staging
  namespace: dep-dlm-staging
  # verify: terraform -chdir=deploy/terraform/environments/staging output -raw eso_service_account_email
  gcpServiceAccount: dep-dlm-staging-eso@dep-dlm-staging-e52e0d90.iam.gserviceaccount.com
