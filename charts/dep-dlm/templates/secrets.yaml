{{- /*
  ClusterSecretStore (one per environment, never shared between RIs) and the
  two ExternalSecrets every component mounts. Sync waves put them before the
  DB bootstrap (wave -1) and the workloads (wave 0).
*/}}
{{- with .Values.secretStore }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels: {{- include "dep-dlm.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
  {{- if eq .provider "gcpsm" }}
    gcpsm:
      projectID: {{ required "secretStore.gcpsm.projectID is required" .gcpsm.projectID }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "secretStore.gcpsm.clusterLocation is required" .gcpsm.clusterLocation }}
          clusterName: {{ required "secretStore.gcpsm.clusterName is required" .gcpsm.clusterName }}
          serviceAccountRef:
            name: {{ .gcpsm.serviceAccount.name }}
            namespace: {{ .gcpsm.serviceAccount.namespace }}
  {{- else if eq .provider "vault" }}
    vault:
      server: {{ required "secretStore.vault.server is required" .vault.server }}
      path: {{ .vault.path }}
      version: {{ .vault.version }}
      {{- with .vault.caBundle }}
      caBundle: {{ . }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ .vault.kubernetesAuth.mountPath }}
          role: {{ .vault.kubernetesAuth.role }}
          serviceAccountRef:
            name: {{ .vault.kubernetesAuth.serviceAccount.name }}
            namespace: {{ .vault.kubernetesAuth.serviceAccount.namespace }}
  {{- else }}
  {{- fail "secretStore.provider must be gcpsm or vault" }}
  {{- end }}
{{- end }}
{{- range $target, $key := dict "dep-dlm-certs" .Values.secrets.certsKey "dep-dlm-config" .Values.secrets.configKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $target }}
  labels: {{- include "dep-dlm.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $.Values.secrets.refreshInterval }}
  secretStoreRef: { name: {{ $.Values.secretStore.name }}, kind: ClusterSecretStore }
  target: { name: {{ $target }}, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ required (printf "secrets key for %s is required" $target) $key }} }
{{- end }}
