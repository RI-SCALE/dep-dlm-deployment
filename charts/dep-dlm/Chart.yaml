apiVersion: v2
name: dep-dlm
description: |
  DEP DLM data orchestration layer (Rucio server and daemons, FTS, OPA) for
  one RI environment. Thin umbrella over charts from dep-dlm-testbed; adds
  secrets projection, policy/patch ConfigMaps, DB bootstrap and an optional
  Gateway.
type: application
version: 0.1.0
appVersion: "41.2.1"

# Pulled with the helm-git plugin, pinned to commits (?ref=<sha>), and vendored
# with `make deps`: commit charts/ and Chart.lock. Argo CD then renders the
# vendored .tgz and needs neither the plugin nor network access to the sources.
# The testbed refs are bumped by `make sync`, together with files/.
dependencies:
  - name: rucio-server
    version: "41.2.1"
    repository: "git+https://github.com/mgajek-cern/helm-charts.git@charts/rucio-server?ref=e69bb891a7045d64ec0fb72198ce7e502fed83a3"
    condition: rucio-server.enabled
  - name: rucio-daemons
    version: "41.2.1"
    repository: "git+https://github.com/mgajek-cern/helm-charts.git@charts/rucio-daemons?ref=e69bb891a7045d64ec0fb72198ce7e502fed83a3"
    condition: rucio-daemons.enabled
  - name: fts
    version: "0.1.0"
    repository: "git+https://github.com/RI-SCALE/dep-dlm-testbed.git@deploy/helm-charts/fts?ref=a5af379b7c47d353e7b1ff30700ad26c7b5105c1"
    condition: fts.enabled
  - name: opa
    version: "0.1.0"
    repository: "git+https://github.com/RI-SCALE/dep-dlm-testbed.git@deploy/helm-charts/opa?ref=a5af379b7c47d353e7b1ff30700ad26c7b5105c1"
    condition: opa.enabled
  - name: observability
    version: "0.1.0"
    repository: "git+https://github.com/RI-SCALE/dep-dlm-testbed.git@deploy/helm-charts/observability?ref=a5af379b7c47d353e7b1ff30700ad26c7b5105c1"
    condition: observability.enabled
