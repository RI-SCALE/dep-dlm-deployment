name: Static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit + terraform validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0     # same as the devcontainer
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit==4.7.0   # same as the devcontainer
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: terraform validate   # not a hook, needs init per root
        run: |
          for d in terraform/environments/onprem/*/; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

  generated:
    name: Generated files up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install terraform-docs
        env:
          TFDOCS_VERSION: v0.24.0
        run: |
          curl -sSL "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/
      - name: Terraform docs
        run: |
          make tf-docs
          git diff --exit-code -- terraform || { echo "::error::run 'make tf-docs' and commit"; exit 1; }
