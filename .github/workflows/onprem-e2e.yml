name: On-premise reference

# Jobs, each optional and re-runnable against an existing deployment:
#   terraform  infra apply (or reconcile), Vault init, infra smoke test, Vault contents
#   gitops     Argo CD bootstrap, wait for sync/OPA/Gateway, Rucio /ping
#   e2e        pods reload the Vault config, the testbed's E2E
#   destroy    tear everything down (alone: destroy only)
# Project-specific values are inputs (defaults: the testbed's staging
# project); only the OIDC client secrets are repository secrets.
# Argo CD renders env.yaml's baseRevision/envRevision from git, so they must
# name the ref this workflow runs on (checked in gitops).

on:
  workflow_dispatch:
    inputs:
      run_terraform:
        description: "terraform: infra apply/reconcile, Vault, infra smoke test"
        type: boolean
        default: true
      run_gitops:
        description: "gitops: Argo CD bootstrap, sync, Gateway /ping (needs applied infra)"
        type: boolean
        default: true
      run_e2e:
        description: "e2e: the testbed's E2E (needs a healthy GitOps deployment)"
        type: boolean
        default: true
      run_destroy:
        description: "destroy: tear down at the end, also on failure (alone: destroy only)"
        type: boolean
        default: false
      scope_profile:
        description: "OIDC profile"
        type: choice
        options: [egi-dev, ls-aai-dev]
        default: egi-dev
      token_mode:
        description: "Token mode (egi-dev: unmanaged only; EGI dev rejects custom audiences)"
        type: choice
        options: [unmanaged, managed]
        default: unmanaged
      testbed_ref:
        description: "dep-dlm-testbed ref (certs, E2E suite)"
        default: main
      gcp_project_id:
        description: "GCP project (testbed bootstrap output project_ids.staging)"
        default: dep-dlm-staging-e52e0d90
      gcp_region:
        description: "GCP region"
        default: europe-west3
      tf_state_bucket:
        description: "Terraform state bucket (prefixes onprem/infra, onprem/vault)"
        default: dep-dlm-tfstate-staging-dep-dlm-staging-e52e0d90
      workload_identity_provider:
        description: "WIF provider (testbed bootstrap output workload_identity_providers.staging)"
        default: projects/738996403212/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
      service_account:
        description: "Terraform CI service account"
        default: dep-dlm-terraform-ci@dep-dlm-staging-e52e0d90.iam.gserviceaccount.com

concurrency:
  group: onprem-${{ inputs.gcp_project_id }}   # one state, one run at a time
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CI: "true"
  AUTO_APPROVE: "1"
  GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
  GCP_REGION: ${{ inputs.gcp_region }}
  TF_STATE_BUCKET: ${{ inputs.tf_state_bucket }}
  SCOPE_PROFILE: ${{ inputs.scope_profile }}
  TOKEN_MODE: ${{ inputs.token_mode }}
  OIDC_CLIENT_SECRET: ${{ inputs.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_SECRET || secrets.EGI_DEV_OIDC_CLIENT_SECRET }}
  ENV_PATH: reference-onprem/staging
  NS: dep-dlm-staging
  INFRA: terraform -chdir=terraform/environments/onprem/infra
  KUBECONFIG: ${{ github.workspace }}/dep-dlm-deployment/.kube/config-onprem

defaults:
  run:
    shell: bash
    working-directory: dep-dlm-deployment   # ../dep-dlm-testbed as in the devcontainer

jobs:
  terraform:
    if: inputs.run_terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - &checkout-deployment
        uses: actions/checkout@v6
        with: { path: dep-dlm-deployment }
      - &checkout-testbed
        uses: actions/checkout@v6
        with: { repository: RI-SCALE/dep-dlm-testbed, ref: "${{ inputs.testbed_ref }}", path: dep-dlm-testbed }
      - &auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
      - &setup-terraform
        uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.8", terraform_wrapper: false }   # keep `output -raw` clean
      - &setup-gcloud
        uses: google-github-actions/setup-gcloud@v2
      - &tools
        name: Tools
        run: |
          [[ -n "$OIDC_CLIENT_SECRET" ]] || { echo "::error::OIDC client secret for ${SCOPE_PROFILE} missing (repository secret)"; exit 1; }
          [[ "$SCOPE_PROFILE/$TOKEN_MODE" != egi-dev/managed ]] || {
            echo "::error::egi-dev needs token_mode=unmanaged (EGI dev rejects custom audiences)"; exit 1; }
          pip install --break-system-packages pytest requests numpy
          ssh-keygen -t rsa -N '' -q -f ~/.ssh/google_compute_engine   # gcloud compute ssh (OS Login)
      - &certs
        name: Certificates (testbed CA, validation storage SAN, Vault cert)
        run: make onprem-certs
      - &init-infra
        name: Terraform init (infra)
        run: make tf-init TF_ENV=onprem/infra

      - name: Fresh or existing deployment
        run: |
          if [[ -n "$($INFRA state list 2>/dev/null)" ]]; then
            echo "::notice::onprem/infra exists: reconciling it"
          else
            echo "Fresh deployment"
            # A Vault state without infra belongs to a Vault that no longer exists.
            gcloud storage rm -r "gs://${TF_STATE_BUCKET}/onprem/vault" 2>/dev/null || true
          fi

      - name: Infra plan & apply
        run: |
          make tf-plan TF_ENV=onprem/infra
          make tf-apply TF_ENV=onprem/infra

      # The validation storage pulls its certificates only at boot; certs are
      # regenerated on every run, so reset it (as the testbed's CI does).
      - name: Validation storage re-pulls its certificates
        run: |
          gcloud compute instances reset "$($INFRA output -raw valstorage_instance_name)" \
            --zone "$($INFRA output -raw zone)" --project "$GCP_PROJECT_ID"
          IP=$($INFRA output -raw valstorage_ip) HOST=$($INFRA output -raw valstorage_hostname)
          for i in $(seq 1 40); do
            san=$(echo | timeout 5 openssl s_client -connect "${IP}:1094" -servername "$HOST" 2>/dev/null \
              | openssl x509 -noout -ext subjectAltName 2>/dev/null) || true
            if grep -q "DNS:${HOST}" <<<"$san"; then echo "xrd3 up, SAN contains ${HOST}"; exit 0; fi
            echo "[$i] validation storage not up yet"; sleep 10
          done
          echo "::error::validation storage not up, or its certificate lacks ${HOST}: ${san:-no certificate}"; exit 1

      - &mask
        name: Mask database passwords
        run: |
          echo "::add-mask::$($INFRA output -raw rucio_db_password)"
          echo "::add-mask::$($INFRA output -raw fts_db_password)"
      - &tunnel
        name: Kubeconfig and kube-apiserver tunnel
        run: |
          make onprem-kubeconfig   # waits for the startup script (about 4 min on a fresh node)
          # SSH over IAP rather than start-iap-tunnel: IAP TCP forwarding opens a
          # websocket per TCP connection and E2E init opens hundreds, some of which
          # fail (SSL RECORD_LAYER_FAILURE); SSH multiplexes them over one.
          # with-iap-tunnel.sh reuses it.
          gcloud compute ssh "$($INFRA output -raw node_name)" --zone "$($INFRA output -raw zone)" \
            --project "$GCP_PROJECT_ID" --tunnel-through-iap --quiet -- \
            -N -L 16443:127.0.0.1:6443 -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -o StrictHostKeyChecking=no > /tmp/tunnel.log 2>&1 &
          for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/16443) 2>/dev/null && exit 0; sleep 1; done
          echo "::error::kube-apiserver tunnel not up"; cat /tmp/tunnel.log; exit 1

      - name: Vault init & infra smoke test
        run: |
          make onprem-vault-init
          make onprem-smoke-test

      - name: Vault contents
        run: |
          make tf-init TF_ENV=onprem/vault
          make onprem-vault-apply

      - &cleanup
        name: Remove local credentials
        if: always()
        run: rm -rf .kube ../dep-dlm-testbed/.kube ../dep-dlm-testbed/certs ../dep-dlm-testbed/userpass-client.cfg

  gitops:
    needs: terraform
    if: always() && inputs.run_gitops && contains(fromJSON('["success","skipped"]'), needs.terraform.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout-deployment
      - name: Argo CD renders this ref
        run: |
          for k in baseRevision envRevision; do
            rev=$(yq ".${k}" "environments/${ENV_PATH}/env.yaml")
            [[ "$rev" == "$GITHUB_REF_NAME" ]] || {
              echo "::error::environments/${ENV_PATH}/env.yaml ${k}=${rev}, but this run is on ${GITHUB_REF_NAME}"; exit 1; }
          done
      - *auth
      - *setup-terraform
      - *setup-gcloud
      - *tools
      - *init-infra
      - *tunnel

      - name: Bootstrap Argo CD
        run: make bootstrap ENV="$ENV_PATH" ARGS=--install-argocd

      - name: Wait for Argo CD, OPA policy and the Gateway
        run: |
          APP="dep-dlm-${ENV_PATH//\//-}"
          until kubectl -n argocd get app "$APP" >/dev/null 2>&1; do sleep 5; done
          kubectl -n argocd wait app/"$APP" --for=jsonpath='{.status.sync.status}'=Synced --timeout=25m
          kubectl -n argocd wait app/"$APP" --for=jsonpath='{.status.health.status}'=Healthy --timeout=15m
          until kubectl -n "$NS" get job opa-init >/dev/null 2>&1; do sleep 5; done   # PostSync hook
          kubectl -n "$NS" wait --for=condition=complete job/opa-init --timeout=5m
          kubectl -n argocd wait app/traefik --for=jsonpath='{.status.health.status}'=Healthy --timeout=10m
          kubectl -n "$NS" wait gateway --all --for=condition=Programmed --timeout=5m

      - name: Rucio through the Gateway
        run: |
          IP=$($INFRA output -raw gateway_static_ip) HOST=$($INFRA output -raw rucio_public_hostname)
          for i in $(seq 1 30); do
            out=$(curl -sf -H "Host: ${HOST}" "http://${IP}/ping") && { echo "$out"; exit 0; }
            echo "[$i] /ping not yet"; sleep 10
          done
          exit 1

      - &diagnostics
        name: Diagnostics
        if: failure()
        run: |
          [[ -f "$KUBECONFIG" ]] || { echo "no kubeconfig"; exit 0; }
          kubectl -n argocd get applications || true
          kubectl -n "$NS" get pods,jobs,externalsecrets,gateway,httproute || true
          kubectl -n traefik get pods || true
          kubectl -n "$NS" logs deploy/rucio-daemons-conveyor-submitter --since=30m 2>/dev/null | grep -iE 'error|fail' | tail -30 || true
          tail -20 /tmp/tunnel.log 2>/dev/null || true
      - *cleanup

  e2e:
    needs: [terraform, gitops]
    if: >-
      always() && inputs.run_e2e &&
      contains(fromJSON('["success","skipped"]'), needs.terraform.result) &&
      contains(fromJSON('["success","skipped"]'), needs.gitops.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout-deployment
      - *checkout-testbed
      - *auth
      - *setup-terraform
      - *setup-gcloud
      - *tools
      - *certs   # mounted by the E2E container (same CA as on the services)
      - *init-infra
      - *mask
      - *tunnel

      - name: Pods pick up the current Vault config
        run: |
          kubectl -n "$NS" annotate externalsecret --all force-sync="$(date +%s)" --overwrite
          sleep 20
          mapfile -t DEPLOYS < <(kubectl -n "$NS" get deploy -o name | grep -v '^deployment.apps/opa$')
          kubectl -n "$NS" rollout restart "${DEPLOYS[@]}"
          for d in "${DEPLOYS[@]}"; do kubectl -n "$NS" rollout status "$d" --timeout=10m; done

      - name: Testbed E2E (init, transfers, deletion)
        run: make onprem-e2e

      - *diagnostics
      - *cleanup

  destroy:
    needs: [terraform, gitops, e2e]
    if: always() && inputs.run_destroy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout-deployment
      - *checkout-testbed
      - *auth
      - *setup-terraform
      - *setup-gcloud
      - *tools
      - *certs   # Terraform's file() and the certs_dir check need them even to destroy
      - *init-infra
      - name: Destroy
        run: |
          if [[ -n "$($INFRA state list 2>/dev/null)" ]]; then
            make tf-destroy TF_ENV=onprem/infra
          else
            echo "onprem/infra state is empty"
          fi
          gcloud storage rm -r "gs://${TF_STATE_BUCKET}/onprem/vault" 2>/dev/null || true
      - *cleanup
